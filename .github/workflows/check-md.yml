name: Check Markdown Files in _posts

on:
  workflow_dispatch:  # 僅允許手動觸發

jobs:
  check-markdown:
    runs-on: ubuntu-latest
    steps:
      # 檢查出代碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 安裝 Ruby 環境
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'  # Ruby 3.2.8
          bundler: '2.5.22'   # 使用與 Ruby 3.2 相容的 Bundler 版本
          bundler-cache: true

      # 安裝 Jekyll 依賴
      - name: Install Dependencies
        run: bundle install

      # 檢查 _posts 資料夾中的 Markdown 文件
      - name: Check Jekyll Build for _posts
        run: |
          # 初始化 error_md_lists.txt
          echo "" > error_md_lists.txt
          
          # 獲取 _posts 資料夾中的所有 Markdown 文件
          find _posts -type f -name "*.md" > md_files.txt
          
          # 逐一檢查每個 Markdown 文件
          while IFS= read -r file; do
            # 模擬 Jekyll 建構，僅包含單個文件
            if ! bundle exec jekyll build --strict --source . --include "$file" > build_log.txt 2>&1; then
              # 如果建構失敗，記錄文件路徑
              echo "$file" >> error_md_lists.txt
            fi
          done < md_files.txt
          
          # 檢查是否有錯誤文件
          if [ -s error_md_lists.txt ]; then
            echo "Found problematic Markdown files. See error_md_lists.txt for details."
          else
            echo "No problematic Markdown files found in _posts."
            echo "No errors found." > error_md_lists.txt
          fi
        continue-on-error: true

      # 提交 error_md_lists.txt 到專案目錄
      - name: Commit error_md_lists.txt
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add error_md_lists.txt
          git commit -m "Add error_md_lists.txt from _posts Markdown check"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
