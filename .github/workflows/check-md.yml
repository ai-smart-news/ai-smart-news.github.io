name: Check Markdown Files

on:
  workflow_dispatch:  # 僅允許手動觸發

jobs:
  check-markdown:
    runs-on: ubuntu-latest
    steps:
      # 檢查出代碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 安裝 Node.js（用於 markdownlint）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 安裝 markdownlint-cli
      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      # 檢查所有 Markdown 文件，輸出錯誤到 error_md_lists.txt
      - name: Run markdownlint
        run: |
          markdownlint '**/*.md' --ignore node_modules > error_md_lists.txt 2>&1 || true
          if [ -s error_md_lists.txt ]; then
            echo "Found Markdown errors. See error_md_lists.txt for details."
          else
            echo "No Markdown errors found."
            echo "No errors found." > error_md_lists.txt
          fi

      # 提交 error_md_lists.txt 到專案目錄
      - name: Commit error_md_lists.txt
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add error_md_lists.txt
          git commit -m "Add error_md_lists.txt from Markdown check"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
