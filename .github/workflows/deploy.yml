name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Check Markdown files
        run: |
          npm install -g markdownlint-cli
          markdownlint ./**/*.md > markdownlint-report.txt || true
          grep -E "MD" markdownlint-report.txt | awk '{print $2}' | sed 's/:.*//' | sort | uniq > problematic_files.txt

      - name: Update _config.yml with problematic files
        run: |
          echo "exclude:" >> _config.yml
          while IFS= read -r file; do
            echo "  - $file" >> _config.yml
          done < problematic_files.txt

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
