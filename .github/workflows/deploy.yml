name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7' # Use Ruby 2.7 for compatibility with ruby_dep 1.5.0
          bundler-cache: true # Cache dependencies for faster builds

      - name: Install Dependencies
        run: |
          gem install bundler -v 2.0.1 # Match Gemfile.lock
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Check Markdown Files
        run: |
          markdownlint ./**/*.md > markdownlint-report.txt || true
          grep -E "MD" markdownlint-report.txt | awk '{print $2}' | sed 's/:.*//' | sort | uniq > problematic_files.txt

      - name: Update _config.yml with Problematic Files
        run: |
          # Ensure exclude section exists or append it
          if ! grep -q "^exclude:" _config.yml; then
            echo "exclude:" >> _config.yml
          fi
          # Append problematic files to exclude list
          while IFS= read -r file; do
            if ! grep -Fx "  - $file" _config.yml; then
              echo "  - $file" >> _config.yml
            fi
          done < problematic_files.txt

      - name: Build Jekyll Site
        run: bundle exec jekyll build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
